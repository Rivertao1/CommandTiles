plugins {
    id "java-library"
    id "maven-publish"
    id "net.neoforged.moddev" version "2.0.143"
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
    withSourcesJar()
}

sourceSets {
    main {
        // Keep the Fabric implementation available as a reference while the
        // NeoForge port is brought up feature by feature.
        java.setSrcDirs(["src/neoforge/java"])
        resources.exclude("fabric.mod.json")
    }
}

neoForge {
    version = project.neo_version

    runs {
        client {
            client()
            gameDirectory = file("run")
            systemProperty "neoforge.enabledGameTestNamespaces", project.mod_id
        }

        configureEach {
            systemProperty "forge.logging.console.level", "info"
        }
    }
}

def metadataProperties = [
        minecraft_version      : minecraft_version,
        minecraft_version_range: minecraft_version_range,
        neo_version            : neo_version,
        loader_version_range   : loader_version_range,
        mod_id                 : mod_id,
        mod_name               : mod_name,
        mod_license            : mod_license,
        mod_version            : mod_version
]

def generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    inputs.properties(metadataProperties)
    expand(metadataProperties)
    from("src/main/templates")
    into("build/generated/sources/modMetadata")
}

sourceSets.main.resources.srcDir(generateModMetadata)
neoForge.ideSyncTask(generateModMetadata)

tasks.withType(JavaCompile).configureEach {
    options.release = 21
    options.encoding = "UTF-8"
}

jar {
    from("LICENSE") {
        rename { "${it}_${archives_base_name}" }
    }
}

publishing {
    publications {
        create("mavenJava", MavenPublication) {
            artifactId = project.archives_base_name
            from components.java
        }
    }
}
